version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      -"5000:5000"
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_CLUSTER=${MONGO_CLUSTER}
    volumes:
      - ./thumbnails:/app/thumbnails:ro
  
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend